name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # Single source of truth for "is this repo healthy?":
      # ruff lint + format-check + pytest + environment.yml freshness.
      - run: pixi run check
